<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ภาพรวม | Task Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header class="page-head">
      <div><p class="eyebrow">ภาพรวมของคุณ</p><h1 id="hello">สวัสดี</h1></div>
      <div class="actions"><a class="btn" href="tasks.html?new=1" id="addBtn">เพิ่มงาน</a></div>
    </header>

    <!-- แบนเนอร์ต้อนรับ -->
    <section class="hero-band">
      <div>
        <p class="eyebrow">หนึ่งอย่างต่อครั้ง</p>
        <h2>ทำให้งานวันนี้<br>ชัดขึ้นอีกนิด</h2>
        <p id="heroSub">กำลังโหลด…</p>
      </div>
      <span class="hero-emblem" id="heroEmblem"></span>
    </section>

    <!-- 4.6 จำนวนงานแยกตามสถานะ -->
    <section class="metrics" id="metrics" aria-label="จำนวนงานตามสถานะ"></section>

    <!-- 4.3 ใกล้ครบกำหนด / เลยกำหนด -->
    <div class="section-head">
      <div><p class="eyebrow">Keep an eye on it</p><h2>กำหนดส่งที่ควรรู้</h2></div>
      <a class="btn ghost" href="tasks.html" id="allLink">บอร์ดงานทั้งหมด</a>
    </div>
    <div class="two-col">
      <section class="card list-card">
        <div class="list-card-head">
          <span class="head-icon" id="icUp"></span>
          <div><h3>ใกล้ครบกำหนด</h3><p>วันนี้ถึง 3 วันข้างหน้า</p></div>
          <span class="count-pill" id="upCount">0</span>
        </div>
        <div id="upcomingList"></div>
      </section>
      <section class="card list-card">
        <div class="list-card-head">
          <span class="head-icon red" id="icOver"></span>
          <div><h3>เลยกำหนด</h3><p>งานที่ยังต้องจัดการ</p></div>
          <span class="count-pill" id="overCount">0</span>
        </div>
        <div id="overdueList"></div>
      </section>
    </div>

    <!-- งานล่าสุด -->
    <div class="section-head">
      <div><p class="eyebrow">Recently added</p><h2>งานล่าสุด</h2></div>
    </div>
    <section class="card rows rows-scroll">
      <div class="rows-head recent-grid"><span>รายการงาน</span><span>วันครบกำหนด</span><span>สถานะ</span></div>
      <div id="recentList"></div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    if (requireLogin()) {
      renderNavbar('dashboard');
      $('hello').textContent = `สวัสดี, ${auth.user.fullName || ''}`;
      $('addBtn').insertAdjacentHTML('afterbegin', icon('plus'));
      $('allLink').insertAdjacentHTML('beforeend', icon('arrow', 16));
      $('heroEmblem').innerHTML = icon('checks');
      $('icUp').innerHTML = icon('calendar');
      $('icOver').innerHTML = icon('alert');
      load();
    }

    // แถวงานในการ์ด ใกล้/เลยกำหนด
    function rowHtml(t, red) {
      return `
        <button class="row-btn" onclick="location.href='tasks.html?view=${t.id}'">
          <span class="row-dot ${red ? 'red' : ''}"></span>
          <span class="row-copy"><strong>${escapeHtml(t.title)}</strong><small>${formatDate(t.dueDate)}</small></span>
          ${statusBadge(t.status)}
          <span class="row-arrow">${icon('arrow', 16)}</span>
        </button>`;
    }

    async function load() {
      try {
        const [{ counts, upcoming, overdue }, recent] = await Promise.all([
          api('/tasks/summary'),
          api('/tasks?sort=newest'),
        ]);

        $('heroSub').textContent = `มี ${counts.total} รายการอยู่ในแผนของคุณ`;

        const cards = [
          ['งานทั้งหมด', counts.total, 'list', ''],
          ['To Do · ยังไม่เริ่ม', counts.todo, 'todo', 'todo'],
          ['Doing · กำลังทำ', counts.doing, 'activity', 'doing'],
          ['Done · เสร็จแล้ว', counts.done, 'checks', 'done'],
          ['เลยกำหนด', counts.overdue, 'alert', 'overdue'],
        ];
        $('metrics').innerHTML = cards.map(([label, n, ic, cls]) => `
          <div class="card metric">
            <span class="metric-icon ${cls}">${icon(ic)}</span>
            <div><div class="metric-num">${n}</div><div class="metric-label">${label}</div></div>
          </div>`).join('');

        $('upCount').textContent = upcoming.length;
        $('overCount').textContent = overdue.length;
        $('upcomingList').innerHTML = upcoming.length
          ? upcoming.map((t) => rowHtml(t, false)).join('')
          : '<div class="empty">ยังไม่มีงานใกล้ครบกำหนด</div>';
        $('overdueList').innerHTML = overdue.length
          ? overdue.map((t) => rowHtml(t, true)).join('')
          : `<div class="empty" style="color:var(--done)">${icon('check')} ไม่มีงานเลยกำหนดในตอนนี้</div>`;

        const latest = recent.slice(0, 4);
        $('recentList').innerHTML = latest.length
          ? latest.map((t) => `
              <div class="rows-item recent-grid" onclick="location.href='tasks.html?view=${t.id}'">
                <span class="row-copy"><strong>${escapeHtml(t.title)}</strong></span>
                <span>${dueLabel(t)}</span>
                <span>${statusBadge(t.status)}</span>
              </div>`).join('')
          : '<div class="empty">ยังไม่มีรายการงาน <a href="tasks.html?new=1">เพิ่มงานแรกของคุณ</a></div>';
      } catch (err) {
        toast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
