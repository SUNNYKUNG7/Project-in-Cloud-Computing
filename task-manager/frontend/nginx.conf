# ==========================================================
# Nginx = เสิร์ฟหน้าเว็บ + Load Balancer ของ /api (แนวเดียวกับ lb1 ใน Week 2)
# ==========================================================

# กลุ่มเครื่อง backend (upstream) — ค่าเริ่มต้นคือ Round Robin (สลับทีละเครื่อง)
upstream backend_pool {
    zone backend_pool 64k;   # ให้ทุก worker ของ Nginx ใช้ลำดับ/สถานะเครื่องร่วมกัน (สลับ web1/web2 สม่ำเสมอ)

    # --- เลือกอัลกอริทึม: เปิดบรรทัดใดบรรทัดหนึ่ง (เอา # ออก) แล้ว nginx -t → reload ---
    # least_conn;      # ส่งให้เครื่องที่งานค้างน้อยสุด
    # ip_hash;         # IP เดิม → เครื่องเดิม

    # passive health check: ล้ม 1 ครั้ง → พักเครื่องนั้น 10 วินาที แล้วส่งให้เครื่องที่เหลือ
    # weight=2 = ได้งานเป็น 2 เท่า (ใช้เมื่อเครื่องขนาดไม่เท่ากัน)
    server web1:3000 max_fails=1 fail_timeout=10s;
    server web2:3000 max_fails=1 fail_timeout=10s;

    keepalive 32;   # เปิด connection ค้างไว้ใช้ซ้ำ ลดเวลาต่อ request
}

# log บอกว่าแต่ละ request ไปเครื่องไหน ใช้เวลาเท่าไร (ดูด้วย docker compose logs frontend)
log_format lb '$remote_addr "$request" $status '
              'upstream=$upstream_addr backend=$upstream_http_x_backend '
              'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location /api/ {
        access_log /var/log/nginx/access.log lb;

        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # เครื่องหนึ่งล่ม → ลองเครื่องถัดไป (GET จะถูกส่งซ้ำ, POST/PUT/DELETE ไม่ส่งซ้ำเพื่อกันบันทึกซ้ำ)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
