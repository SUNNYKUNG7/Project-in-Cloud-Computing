# ==========================================================
# Personal Task Management System — Three-Tier (รันในเครื่อง)
#   Presentation Tier : frontend (Nginx เสิร์ฟ HTML/CSS/JS + proxy /api)
#   Application Tier  : backend  (Node.js + Express REST API)
#   Data Tier         : db       (MySQL 8)
# ใช้คำสั่ง:  docker compose up -d --build
# เปิดเว็บ:   http://localhost:8080
# ==========================================================
services:
  # ---------- Data Tier ----------
  db:
    image: mysql:8.0
    container_name: tm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql                         # เก็บข้อมูลถาวร (ลบ container ข้อมูลไม่หาย)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # สร้างตารางตอนรันครั้งแรก
    ports:
      - "3307:3306"   # เปิดให้ต่อจาก DBeaver/Workbench ได้ที่ localhost:3307 (กันชนกับ MySQL ในเครื่อง)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Application Tier ----------
  backend:
    build: ./backend
    container_name: tm-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db            # ชื่อ service ของ MySQL (ตอนขึ้น K8s จะเปลี่ยนเป็นชื่อ Service)
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy   # รอให้ MySQL พร้อมก่อนค่อยเริ่ม backend
    ports:
      - "3000:3000"   # ยิง API ตรงได้ (เช่นทดสอบด้วย Postman)

  # ---------- Presentation Tier ----------
  frontend:
    build: ./frontend
    container_name: tm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
